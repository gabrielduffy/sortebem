server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Webhook endpoints - Proxy para Supabase Edge Functions
    location /api/webhook/asaas {
        proxy_pass https://ctjdbnvcqcyitpydnmdt.supabase.co/functions/v1/webhook-asaas;
        proxy_http_version 1.1;
        proxy_set_header Host ctjdbnvcqcyitpydnmdt.supabase.co;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0amRibnZjcWN5aXRweWRubWR0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcwMjc5NDgsImV4cCI6MjA4MjYwMzk0OH0.-uOSbHoV3HxMZ3WXdIIfH7PF_WwKagqSANPwzijlBnU";
        proxy_buffering off;
    }

    location /api/webhook/pagseguro {
        proxy_pass https://ctjdbnvcqcyitpydnmdt.supabase.co/functions/v1/webhook-pagseguro;
        proxy_http_version 1.1;
        proxy_set_header Host ctjdbnvcqcyitpydnmdt.supabase.co;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0amRibnZjcWN5aXRweWRubWR0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcwMjc5NDgsImV4cCI6MjA4MjYwMzk0OH0.-uOSbHoV3HxMZ3WXdIIfH7PF_WwKagqSANPwzijlBnU";
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
