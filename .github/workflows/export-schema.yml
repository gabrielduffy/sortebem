name: Export Supabase Schema

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

jobs:
  export:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Login no Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx supabase@latest login --token $SUPABASE_ACCESS_TOKEN
      
      - name: Link ao projeto
        run: npx supabase@latest link --project-ref ctjdbnvcqcyitpydnmdt
      
      - name: Exportar Schema
        run: |
          echo "📦 Exportando schema..."
          npx supabase@latest db dump --schema-only -f supabase_schema.sql
          echo "✅ Schema exportado!"
      
      - name: Exportar dados de settings
        run: |
          echo "📦 Exportando settings..."
          npx supabase@latest db dump --data-only --use-copy=false -t settings -f supabase_settings_data.sql
          echo "✅ Settings exportados!"
      
      - name: Commit e Push
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add supabase*.sql
          git diff --staged --quiet || git commit -m "chore: atualizar schema [skip ci]"
          git push
