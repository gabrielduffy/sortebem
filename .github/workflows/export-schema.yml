name: Export Supabase Schema

on:
  workflow_dispatch: # Permite rodar manualmente
  schedule:
    - cron: '0 3 * * 1' # Toda segunda-feira às 3h (opcional)

jobs:
  export:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Instalar Supabase CLI
        run: npm install -g supabase
      
      - name: Login no Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          echo "Configurando access token..."
          supabase login --token $SUPABASE_ACCESS_TOKEN
      
      - name: Link ao projeto
        run: supabase link --project-ref ctjdbnvcqcyitpydnmdt
      
      - name: Exportar Schema
        run: |
          echo "Exportando schema do banco..."
          supabase db dump --schema-only -f supabase_schema.sql
          echo "✅ Schema exportado com sucesso!"
      
      - name: Exportar dados de settings
        run: |
          echo "Exportando dados da tabela settings..."
          supabase db dump --data-only --use-copy=false -t settings -f supabase_settings_data.sql
          echo "✅ Dados exportados!"
      
      - name: Commit alterações
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add supabase_schema.sql supabase_settings_data.sql
          git diff --staged --quiet || git commit -m "chore: atualizar schema do Supabase [skip ci]"
      
      - name: Push para o repositório
        run: git push
